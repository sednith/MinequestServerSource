name: Scheduled PROD restart
run-name: Scheduled PROD restart (${{ inputs.stage }})

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Restart stage to run
        required: true
        default: all
        type: choice
        options:
          - all
          - adjustment
          - playworld
          - velocity

concurrency:
  group: minecraft-server-deploy
  cancel-in-progress: false

env:
  PROD_SERVER_DIR: /home/server/prod
  # Пауза между этапами ручного запуска `stage: all`: 04:45 -> 05:00 -> 05:15 MSK.
  # Ночной рестарт теперь выполняется на сервере systemd-таймерами (deploy/systemd).
  STAGE_PAUSE_SECONDS: 900

jobs:
  adjustment:
    name: Restart lobby (adjustment)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.stage == 'all' || inputs.stage == 'adjustment' }}
    steps:
      - name: Restart lobby over SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          RESTART_STAGE: adjustment
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          command_timeout: 20m
          envs: PROD_SERVER_DIR,RESTART_STAGE
          script: |
            set -euo pipefail

            if [ ! -d "$PROD_SERVER_DIR" ]; then
              echo "[ERROR] PROD directory does not exist: $PROD_SERVER_DIR" >&2
              exit 1
            fi

            cd "$PROD_SERVER_DIR"
            bash ./scripts/scheduled-restart.sh "$RESTART_STAGE"

  playworld:
    name: Restart playworld
    needs: adjustment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !cancelled() && needs.adjustment.result != 'failure' && (inputs.stage == 'all' || inputs.stage == 'playworld') }}
    steps:
      - name: Wait for the next stage slot
        run: sleep "$STAGE_PAUSE_SECONDS"
      - name: Restart playworld over SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          RESTART_STAGE: playworld
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          command_timeout: 20m
          envs: PROD_SERVER_DIR,RESTART_STAGE
          script: |
            set -euo pipefail

            if [ ! -d "$PROD_SERVER_DIR" ]; then
              echo "[ERROR] PROD directory does not exist: $PROD_SERVER_DIR" >&2
              exit 1
            fi

            cd "$PROD_SERVER_DIR"
            bash ./scripts/scheduled-restart.sh "$RESTART_STAGE"

  velocity:
    name: Restart velocity
    needs: playworld
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !cancelled() && needs.playworld.result != 'failure' && (inputs.stage == 'all' || inputs.stage == 'velocity') }}
    steps:
      - name: Wait for the next stage slot
        run: sleep "$STAGE_PAUSE_SECONDS"
      - name: Restart velocity over SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          RESTART_STAGE: velocity
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          command_timeout: 20m
          envs: PROD_SERVER_DIR,RESTART_STAGE
          script: |
            set -euo pipefail

            if [ ! -d "$PROD_SERVER_DIR" ]; then
              echo "[ERROR] PROD directory does not exist: $PROD_SERVER_DIR" >&2
              exit 1
            fi

            cd "$PROD_SERVER_DIR"
            bash ./scripts/scheduled-restart.sh "$RESTART_STAGE"
