name: Deploy Dev Environment

on:
  push:
    branches:
      - dev

concurrency:
  group: minecraft-server-deploy
  cancel-in-progress: false

jobs:
  deploy_dev:
    name: "Deploy to Dev"
    runs-on: ubuntu-latest
    env:
      DEV_SERVER_DIR: /home/server/dev

    steps:
      - name: Deploy pipeline
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          command_timeout: 20m
          envs: DEV_SERVER_DIR
          script: |
            set -euo pipefail

            cd "$DEV_SERVER_DIR"

            # Синхронизируем дерево до запуска сценария: deploy-dev.sh сам делает
            # checkout, и если он изменён этим же пушем, bash может дочитать
            # старую версию файла и выполнить устаревший код.
            git fetch origin dev
            git checkout -f -B dev origin/dev
            git reset --hard origin/dev

            bash ./scripts/deploy-dev.sh
