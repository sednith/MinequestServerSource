name: Release and Deploy PROD
run-name: Release ${{ inputs.release_mode }} to PROD

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release a normal DEV build or hotfix a selected branch
        required: true
        type: choice
        options:
          - release
          - hotfix
      release_type:
        description: Version increment for a normal release (hotfixes always use patch)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      hotfix_branch:
        description: Source branch for hotfix (ignored for a normal release)
        required: false
        type: string
      restart_prod:
        description: Restart PROD servers after deploying a hotfix
        required: true
        default: false
        type: boolean

concurrency:
  group: minecraft-server-deploy
  cancel-in-progress: false

env:
  PROD_DIR: /home/server/prod
  PROD_LAST_GOOD_SHA_FILE: /home/server/prod/.last-good-deploy-sha

jobs:
  # Публикация отделена от деплоя: если деплой PROD упадёт, его можно
  # перезапустить иконкой "Re-run" у этого job'а, не повторяя слияние и тег.
  publish:
    name: Create version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Merge changes and create version tag
        id: release
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          HOTFIX_BRANCH: ${{ inputs.hotfix_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Рабочее дерево не используется вообще: merge-коммит собирается
          # через plumbing (merge-tree + commit-tree). Так релиз не зависит от
          # CRLF/EOL-состояния файлов в рабочей копии раннера.
          git fetch origin --tags
          git fetch origin main dev

          MERGE_TREE_HELP="$(git merge-tree -h 2>&1 || true)"
          if [[ "$MERGE_TREE_HELP" != *"--write-tree"* ]]; then
            echo "[ERROR] Нужен git >= 2.38 (merge-tree --write-tree), на раннере: $(git --version)" >&2
            exit 1
          fi

          # 1. Валидация режима и выбор источника слияния.
          case "$RELEASE_MODE" in
            release)
              if ! git merge-base --is-ancestor origin/main origin/dev; then
                echo "[ERROR] В origin/main есть коммиты, отсутствующие в origin/dev (например, после релиза, когда job sync-dev не отработал)" >&2
                echo "[ERROR] Обычный релиз заблокирован: сначала влейте main в dev и запушьте dev" >&2
                exit 1
              fi
              SOURCE_REF=origin/dev
              VERSION_TYPE="$RELEASE_TYPE"
              ;;
            hotfix)
              if [[ -z "$HOTFIX_BRANCH" ]] || ! git check-ref-format --branch "$HOTFIX_BRANCH" >/dev/null; then
                echo "[ERROR] Укажите корректное имя ветки хотфикса" >&2
                exit 2
              fi
              if [[ "$HOTFIX_BRANCH" == main || "$HOTFIX_BRANCH" == dev ]]; then
                echo "[ERROR] Для хотфикса выберите отдельную исходную ветку, не main/dev" >&2
                exit 2
              fi
              git fetch origin "refs/heads/$HOTFIX_BRANCH:refs/remotes/origin/$HOTFIX_BRANCH"
              SOURCE_REF="origin/$HOTFIX_BRANCH"
              VERSION_TYPE=patch
              ;;
            *)
              echo "[ERROR] Неизвестный режим релиза: $RELEASE_MODE" >&2
              exit 2
              ;;
          esac

          # 2. Версия. Считается до слияния, потому что нужна в сообщении
          #    merge-коммита. Номера версий принадлежат линии main: теги на
          #    невлитых ветках не сдвигают релизную линию, но занимают номер
          #    (см. проверку коллизии ниже).
          LATEST_TAG="$(git tag --list 'v[0-9]*' --merged origin/main | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$LATEST_TAG" ]]; then
            LATEST_TAG=v1.0.0
            echo "[WARN] Стабильных тегов vX.Y.Z не найдено; используется базовая версия $LATEST_TAG"
          fi

          VERSION="${LATEST_TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$VERSION_TYPE" in
            major) ((MAJOR += 1)); MINOR=0; PATCH=0 ;;
            minor) ((MINOR += 1)); PATCH=0 ;;
            patch) ((PATCH += 1)) ;;
            *) echo "[ERROR] Неизвестный тип версии: $VERSION_TYPE" >&2; exit 2 ;;
          esac

          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null \
              || git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
            echo "[ERROR] Тег $NEW_TAG уже существует; ветки не отправлены" >&2
            exit 1
          fi

          # 3. Релиз без новых коммитов выпускать не из чего: merge-коммит
          #    получился бы пустым, а тег лёг бы на предыдущий релиз. Падаем
          #    до пуша, поэтому номер версии не расходуется.
          if git merge-base --is-ancestor "$SOURCE_REF" origin/main; then
            echo "[ERROR] $SOURCE_REF не содержит новых коммитов относительно main" >&2
            echo "[ERROR] Выпускать новую версию не из чего: main, тег и PROD не изменены" >&2
            exit 1
          fi

          # 4. Merge-коммит релиза (plumbing, без checkout и без рабочего дерева).
          RELEASE_MSG="release: $NEW_TAG"
          if [[ "$RELEASE_MODE" == hotfix ]]; then
            RELEASE_MSG+=" (hotfix: $HOTFIX_BRANCH)"
          fi
          echo "[INFO] Создание merge-коммита '$RELEASE_MSG'"
          if ! MERGE_TREE="$(git merge-tree --write-tree origin/main "$SOURCE_REF")"; then
            echo "[ERROR] Конфликт при слиянии $SOURCE_REF в main" >&2
            echo "$MERGE_TREE" >&2
            echo "[ERROR] Публикация отменена" >&2
            exit 1
          fi
          NEW_COMMIT="$(git commit-tree "$MERGE_TREE" -p origin/main -p "$SOURCE_REF" -m "$RELEASE_MSG")"
          if [ "$(git rev-list --parents -n 1 "$NEW_COMMIT" | wc -w)" -ne 3 ]; then
            echo "[ERROR] Получился не merge-коммит; публикация отменена" >&2
            exit 1
          fi
          echo "[INFO] Merge-коммит: $NEW_COMMIT"

          # 5. Changelog, тег, атомарный push.
          #    --no-merges исключает и сам релизный merge-коммит, и sync-коммиты.
          CHANGELOG="$(git log "$LATEST_TAG".."$NEW_COMMIT" --no-merges \
            --invert-grep -i --grep='\[internal\]' --grep='\[no-changelog\]' \
            --pretty=format:'- %s' || true)"
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG='- Мелкие правки и улучшения'
          fi
          git tag -a "$NEW_TAG" "$NEW_COMMIT" -m "Release $NEW_TAG ($VERSION_TYPE)" -m "$CHANGELOG"

          echo "[INFO] Публикация main и тега $NEW_TAG"
          git push --atomic origin "$NEW_COMMIT:refs/heads/main" "refs/tags/$NEW_TAG"
          echo "release_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "[OK] Создан релиз $NEW_TAG"

  deploy:
    name: Deploy PROD
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy PROD and optionally restart
        uses: appleboy/ssh-action@v1.0.0
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          RESTART_PROD: ${{ inputs.release_mode == 'hotfix' && inputs.restart_prod }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          command_timeout: 20m
          envs: RELEASE_TAG,RESTART_PROD,PROD_DIR,PROD_LAST_GOOD_SHA_FILE
          script: |
            set -euo pipefail

            if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "[ERROR] Некорректный тег релиза: $RELEASE_TAG" >&2
              exit 2
            fi
            if [[ -z "$RELEASE_TAG" ]]; then
              echo "[WARN] Тег не передан (повторный запуск job'а); разворачиваю текущий origin/main"
            fi
            if [ ! -d "$PROD_DIR" ]; then
              echo "[ERROR] Каталог не существует: $PROD_DIR" >&2
              exit 1
            fi

            echo "[ЭТАП 1/2] Обновление PROD до актуального origin/main (релиз ${RELEASE_TAG:-без тега})"
            cd "$PROD_DIR"
            git fetch origin --tags +refs/heads/main:refs/remotes/origin/main
            TARGET_SHA="$(git rev-parse refs/remotes/origin/main)"
            LAST_GOOD_SHA=""

            if [ "$RESTART_PROD" = "true" ]; then
              if [ ! -s "$PROD_LAST_GOOD_SHA_FILE" ]; then
                echo "[ERROR] Не найден SHA последней успешной версии: $PROD_LAST_GOOD_SHA_FILE" >&2
                echo "[ERROR] До первого рестарта укажите в этом файле подтверждённый SHA работающей версии PROD." >&2
                exit 1
              fi
              LAST_GOOD_SHA="$(tr -d '[:space:]' < "$PROD_LAST_GOOD_SHA_FILE")"
              if [[ ! "$LAST_GOOD_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] \
                  || ! git cat-file -e "${LAST_GOOD_SHA}^{commit}" 2>/dev/null; then
                echo "[ERROR] В $PROD_LAST_GOOD_SHA_FILE указан недействительный или недоступный SHA" >&2
                exit 1
              fi
              echo "[INFO] Целевая версия: $TARGET_SHA; последняя успешная версия: $LAST_GOOD_SHA"
            fi

            git checkout -f -B main "$TARGET_SHA"
            git reset --hard "$TARGET_SHA"

            if [ "$RESTART_PROD" = "true" ]; then
              echo "[ЭТАП 2/2] Рестарт PROD и проверка готовности"
              if bash ./scripts/restart.sh prod; then
                printf '%s\n' "$TARGET_SHA" > "${PROD_LAST_GOOD_SHA_FILE}.tmp"
                mv "${PROD_LAST_GOOD_SHA_FILE}.tmp" "$PROD_LAST_GOOD_SHA_FILE"
                echo "[OK] Новая версия подтверждена и записана как последняя успешная"
              else
                RESTART_EXIT_CODE=$?
                echo "[ERROR] Новая версия PROD не прошла проверку" >&2
                echo "[ERROR] restart.sh откатил PROD на последнюю успешную версию $LAST_GOOD_SHA (подробности отката — в логе выше)" >&2
                echo "[ERROR] Релиз ${RELEASE_TAG:-без тега} считается неуспешным: main и тег остаются опубликованными" >&2
                echo "[WARN] job sync-dev всё равно синхронизирует main в dev" >&2
                exit "$RESTART_EXIT_CODE"
              fi
            else
              echo "[ЭТАП 2/2] Рестарт PROD не запрошен; работающие процессы не перезапускаются"
            fi

            echo "[OK] PROD развернут на $TARGET_SHA (${RELEASE_TAG:-без тега, повторный запуск})"

  # Синхронизация идёт отдельным job'ом и выполняется даже при упавшем деплое,
  # чтобы инвариант "main ⊆ dev" восстанавливался без ручных действий.
  sync-dev:
    name: Sync main into dev
    needs: [publish, deploy]
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags +refs/heads/main:refs/remotes/origin/main +refs/heads/dev:refs/remotes/origin/dev

          if ! git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            echo "[ERROR] После git fetch отсутствует refs/remotes/origin/main" >&2
            exit 1
          fi

          MAIN_REF=refs/remotes/origin/main
          DEV_REF=refs/remotes/origin/dev

          if ! git rev-parse -q --verify "$MAIN_REF" >/dev/null; then
            echo "[ERROR] После git fetch отсутствует $MAIN_REF" >&2
            exit 1
          fi

          # Рабочее дерево не трогаем: и fast-forward, и sync-merge уходят
          # в origin/dev без checkout (иначе CRLF/EOL-файлы ломают merge).
          if git merge-base --is-ancestor "$MAIN_REF" "$DEV_REF"; then
            echo "[INFO] Синхронизация не требуется: dev уже содержит все коммиты main"
            exit 0
          fi

          if git merge-base --is-ancestor "$DEV_REF" "$MAIN_REF"; then
            echo "[INFO] dev отстаёт от origin/main; выполняется fast-forward"
            git push origin "$MAIN_REF:refs/heads/dev"
          else
            echo "[INFO] Ветки main и dev разошлись; создаётся merge-коммит синхронизации"
            if ! MERGE_TREE="$(git merge-tree --write-tree "$DEV_REF" "$MAIN_REF")"; then
              echo "[ERROR] Конфликт при синхронизации main в dev" >&2
              echo "$MERGE_TREE" >&2
              echo "[WARN] dev требует ручного разрешения конфликта" >&2
              exit 1
            fi
            SYNC_COMMIT="$(git commit-tree "$MERGE_TREE" -p "$DEV_REF" -p "$MAIN_REF" -m "sync: merge 'main' into 'dev' [internal]")"
            git push origin "$SYNC_COMMIT:refs/heads/dev"
          fi

          echo "[OK] dev синхронизирован; push-trigger запустит deploy_dev.yml"
